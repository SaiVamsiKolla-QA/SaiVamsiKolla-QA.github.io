name: Portfolio quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Static, browser, accessibility, and performance gates
    runs-on: macos-15
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium firefox webkit

      - name: Validate HTML
        run: npm run validate:html

      - name: Validate internal links and local assets
        run: npm run validate:assets

      - name: Type-check test infrastructure
        run: npm run typecheck

      - name: Run smoke tests
        run: npm run test:smoke
        env:
          PW_REPORT_SUFFIX: smoke

      - name: Run functional tests
        run: npm run test:functional
        env:
          PW_REPORT_SUFFIX: functional

      - name: Run responsive tests
        run: npm run test:responsive
        env:
          PW_REPORT_SUFFIX: responsive

      - name: Run accessibility tests
        run: npm run test:a11y
        env:
          PW_REPORT_SUFFIX: accessibility

      - name: Run link-integrity tests
        run: npm run test:links
        env:
          PW_REPORT_SUFFIX: links

      - name: Run Lighthouse budgets
        run: npm run lighthouse:ci

      - name: Upload Playwright reports and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-quality-evidence
          path: |
            playwright-report/
            test-results/
            lighthouse-results/
          if-no-files-found: ignore
          retention-days: 14
